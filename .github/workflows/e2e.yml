name: e2e
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ログインは DB に作った Session で再現するので、外部サービスの認証情報はダミーでよい
      NEXTAUTH_SECRET: dummy
      DISCORD_CLIENT_ID: dummy
      DISCORD_CLIENT_SECRET: dummy
      SPOTIFY_CLIENT_ID: dummy
      SPOTIFY_CLIENT_SECRET: dummy
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      name: Install pnpm
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
      with:
        version: 2.121.0
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Start Supabase
      # E2E で使うのは DB と Storage だけなので、それ以外のコンテナは立ち上げない
      run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
    - name: Export Supabase env
      run: |
        supabase status -o json > /tmp/supabase-status.json
        {
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -er .API_URL /tmp/supabase-status.json)"
          echo "SUPABASE_ANON_KEY=$(jq -er .ANON_KEY /tmp/supabase-status.json)"
          echo "SUPABASE_JWT_SECRET=$(jq -er .JWT_SECRET /tmp/supabase-status.json)"
        } >> "$GITHUB_ENV"
    - name: Migrate database
      run: pnpm exec prisma migrate deploy
    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium
    - name: Run E2E
      run: pnpm e2e
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 7
