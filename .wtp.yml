version: "1.0"

defaults:
  base_dir: .claude/worktrees

hooks:
  post_create:
    - type: copy
      from: .env
      to: .env
    - type: copy
      from: AGENTS.md
      to: AGENTS.md
    # postinstall の prisma generate で src/types/generated も作られる
    - type: command
      command: pnpm install --frozen-lockfile
